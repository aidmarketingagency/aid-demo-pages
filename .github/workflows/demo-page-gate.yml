# Demo Page Gate — deterministic structural review for demo page PRs.
#
# Why the job is named "Admiral Review": merge-freeze-guard in Agentic_Systems
# refuses any agent-side `gh pr merge` unless a passing check run with exactly
# that name exists on the PR. Per Ryan's 2026-08-09 review-diet ruling, content
# gets structural QA instead of LLM review — so for this repo, the Admiral
# check IS the structural DEMO PAGE CONTRACT validator, not a model panel.
# Without this check, dossier PRs rot unmerged and every outreach email links
# a 404 (dossiers 18-22, discovered 2026-08-10).
name: Demo Page Gate
on:
  pull_request:
permissions:
  contents: read
jobs:
  admiral_review:
    name: Admiral Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce DEMO PAGE CONTRACT on changed pages
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/validate_demo_pages.py --base "origin/${BASE_REF}"
